# ═══════════════════════════════════════════════════════════════
# CottonGreen AI — Nginx Reverse Proxy Configuration
# ═══════════════════════════════════════════════════════════════

upstream cottongreen_app {
    server app:7860;
    keepalive 16;
}

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=predict:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=60r/m;

server {
    listen 80;
    server_name _;

    # ── Security Headers ──────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Upload limit ──────────────────────────────────────────
    client_max_body_size 16M;

    # ── Gzip Compression ──────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml text/javascript image/svg+xml;

    # ── Static Files (served by Nginx directly) ───────────────
    location /static/ {
        alias /app/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Rate-limited routes ───────────────────────────────────
    location /auth/login {
        limit_req zone=login burst=3 nodelay;
        proxy_pass http://cottongreen_app;
        include /etc/nginx/proxy_params_custom;
    }

    location /predict {
        limit_req zone=predict burst=5 nodelay;
        proxy_pass http://cottongreen_app;
        proxy_read_timeout 120s;
        include /etc/nginx/proxy_params_custom;
    }

    location /api/ {
        limit_req zone=api burst=10 nodelay;
        proxy_pass http://cottongreen_app;
        include /etc/nginx/proxy_params_custom;
    }

    # ── All other requests ────────────────────────────────────
    location / {
        proxy_pass http://cottongreen_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # ── Health check (no rate limit) ──────────────────────────
    location /health {
        proxy_pass http://cottongreen_app;
        access_log off;
    }

    # ── Error pages ───────────────────────────────────────────
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

